# Security fixes arrive on their own (Dependabot security updates). This file
# is about the other half: keeping versions from drifting so far that the
# eventual jump has to be verified by hand. In September 2026 Dashy's runner was
# two majors behind, Electron nine, and the bundler seven minors — each step
# would have been dull, together they were an afternoon.
#
# Monthly and grouped, so the noise stays at one pull request per ecosystem.
version: 2

# The dev kit is pinned in three places that must name one release: the npm version in package.json and the
# lockfile, and the commit (with its `# vX.Y.Z` comment) in the `uses:` lines of ci.yml and release.yml.
# `opdk release check` fails when they disagree, so the kit moves in one pull request across both ecosystems,
# checked daily so a kit release reaches Garmy the next day. The regular entries below ignore it.
multi-ecosystem-groups:
  kit:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["obsidian-plugin-dev-kit"]
    multi-ecosystem-group: "kit"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["Dimagious/obsidian-plugin-dev-kit*"]
    multi-ecosystem-group: "kit"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # The kit moves in the `kit` group above, together with the two workflow SHAs.
      - dependency-name: "obsidian-plugin-dev-kit"
      # typescript-eslint and eslint-plugin-obsidianmd now come through the kit; its peer ranges do not allow
      # TypeScript 7 yet and the whole group failed `npm ci` on it. Revisit when a kit release allows it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Obsidian runs on its own Electron; ours only drives it for the e2e suite and moves with Dashy's.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      # Pinned to an exact version: the package ships a new major every few weeks and a major can change
      # what a UI test sees. Bump it by hand, together with a test run.
      - dependency-name: "obsidian-test-mocks"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request, one lockfile. Separate ones conflict with each other
      # the moment the first is merged.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  # ci.yml, release.yml and pages.yml pin every action to a full commit SHA with the version in a comment;
  # Dependabot moves both together.
  # The kit's reusable workflows move in the `kit` group above, with the npm version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "Dimagious/obsidian-plugin-dev-kit*"
    groups:
      actions:
        patterns: ["*"]
