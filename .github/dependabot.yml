# Security fixes arrive on their own (Dependabot security updates). This file
# is about the other half: keeping versions from drifting so far that the
# eventual jump has to be verified by hand. In September 2026 Dashy's runner was
# two majors behind, Electron nine, and the bundler seven minors — each step
# would have been dull, together they were an afternoon.
#
# Monthly and grouped, so the noise stays at one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # typescript-eslint and eslint-plugin-obsidianmd do not support TypeScript 7 yet: the whole group
      # failed `npm ci` on it. Revisit when their peer ranges allow it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Obsidian runs on its own Electron; ours only drives it for the e2e suite and moves with Dashy's.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request, one lockfile. Separate ones conflict with each other
      # the moment the first is merged.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  # The workflows pin actions by major, and the runner already warns that the
  # Node 20 ones are deprecated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
