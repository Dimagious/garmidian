name: release
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # The kit's workflow builds in a job with a read-only token, attests main.js, manifest.json and styles.css, and
    # makes a draft release with the CHANGELOG section as notes. `opdk release` verifies the draft and publishes it.
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/release.yml@6e33ca4f10b24fc9f7547f41ea9902fe30ebb362
